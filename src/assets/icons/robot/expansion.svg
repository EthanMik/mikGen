<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.375 0.375 23.25 23.25">
    <!-- Robot body -->
    <rect x="7" y="7" width="16" height="16" fill="rgba(150, 150, 150, 0.4)" stroke="black" stroke-width="1.25" />
    <!-- Heading -->
    <line x1="15" y1="15" x2="15" y2="7" stroke="black" stroke-width="1.5" />
    <!-- Center -->
    <circle cx="15" cy="15" r="2" fill="rgba(150, 150, 150, 0.4)" />
    <!-- Front expansion -->
    <rect x="7" y="1" width="16" height="6" fill="rgba(150, 150, 150, 0.18)" stroke="black" stroke-width="1.25" />
    <!-- Left expansion -->
    <rect x="1" y="7" width="6" height="16" fill="rgba(150, 150, 150, 0.18)" stroke="black" stroke-width="1.25" />
</svg>
